services:
    ui-job:
        build:
            context: .
            dockerfile: ./terrazzo-ui/Dockerfile
        restart: no
        volumes:
            - type: bind
              source: ${NSM_WWW_PATH}
              target: /www
        env_file:
            - .env
    api:
        build:
            context: .
            dockerfile: ./terrazzo-api/Dockerfile
        depends_on:
            db-migrate:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
        ports:
            - "${API_PORT}:${API_PORT}"
            - "${SOCKET_PORT}:${SOCKET_PORT}"
            - "${SOCKET_ADMIN_PORT}:${SOCKET_ADMIN_PORT}"
        restart: always
        networks:
            - default
            - cache
        healthcheck:
            test: ["CMD", "curl", "-f", "http://0.0.0.0:${API_PORT}/"]
            interval: 15s
            timeout: 10s
            retries: 5
            start_period: 30s
        volumes:
            - type: bind
              source: ${VOLUME_PATH}/db
              target: /db
              bind:
                  create_host_path: true
        env_file:
            - .env

    db-migrate:
        build:
            context: .
            dockerfile: ./terrazzo-db/Dockerfile
        restart: "no"
        command: ["npm", "run", "migrate:up"]
        volumes:
            - type: bind
              source: ${VOLUME_PATH}/db
              target: /db
              bind:
                  create_host_path: true
        env_file:
            - .env

    redis:
        image: redis:7-alpine
        restart: always
        networks:
            - cache
        volumes:
            - type: bind
              source: ${VOLUME_PATH}/redis
              target: /data
              bind:
                  create_host_path: true
        command: redis-server --appendonly yes
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 3

networks:
    cache:
        internal: true
